<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaka</title>
<link type="image/x-icon" rel="icon" href="img/gams-g.png">
<style>
  html,body{margin:0;height:100%;background:#000}
  iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="f" src="https://z.is-my.app/" allow="fullscreen; clipboard-read; clipboard-write"></iframe>

<script>
/* Tab disguise, same storage and channel as Settings.html:
   localStorage "gams" -> { title, icon }, and BroadcastChannel "BroadcastDisguise". */
const BroadcastDisguise = new BroadcastChannel('BroadcastDisguise');
const ogTitle = document.title;
const ogIcon = document.querySelector('link[rel*="icon"]').href;

function getDisguise() {
  try {
    const stored = JSON.parse(localStorage.getItem('gams')) || {};
    return { title: stored.title || '', icon: stored.icon || '' };
  } catch (e) {
    return { title: '', icon: '' };
  }
}

function setFavicon(href) {
  document.querySelectorAll('link[rel*="icon"]').forEach(function (el) { el.remove(); });
  const link = document.createElement('link');
  link.type = 'image/x-icon';
  link.rel = 'icon';
  link.href = href;
  document.head.appendChild(link);
}

function applyDisguise() {
  const d = getDisguise();
  document.title = d.title || ogTitle;
  setFavicon(d.icon || ogIcon);

  // When this page sits inside the shareable shell, the tab belongs to the parent page.
  try {
    if (window.top !== window.self) {
      window.top.postMessage({ gamsDisguise: { title: d.title, icon: d.icon } }, '*');
    }
  } catch (e) {}
}

applyDisguise();
BroadcastDisguise.onmessage = applyDisguise;
// Also pick up changes made in another tab even if the broadcast was missed.
window.addEventListener('storage', function (e) { if (e.key === 'gams' || e.key === null) applyDisguise(); });
</script>
</body>
</html>
